name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Enviar resultados a Zephyr
      if: ${{ !cancelled() }}
      run: |
        curl -sSf -X POST \
          "https://api.zephyrscale.smartbear.com/v2/automations/executions/junit?projectKey=MT&autoCreateTestCases=false" \
          -H "Authorization: Bearer ${{ secrets.ZEPHYR_TOKEN }}" \
          -F "file=@results/junit.xml" \
          -F 'testCycle={"name":"CI Playwright #${{ github.run_number }}"};type=application/json'
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
